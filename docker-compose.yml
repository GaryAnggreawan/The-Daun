services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cafe_pos
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe_password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://cafe:cafe_password@db:5432/cafe_pos
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set — copy .env.example to .env and set a real value}
      PORT: 4000
    ports: ["4000:4000"]
    depends_on: [db]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  pgdata:
